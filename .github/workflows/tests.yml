name: CPU checks
on: [push, pull_request]
jobs:
  tests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -e '.[test]'
      - run: pytest -q
      - run: python -m compileall -q spl_ft
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: node --check spl_ft/static/app.js
