[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "spl-ft"
version = "0.1.0"
description = "LFM3 experiment workbench for NVIDIA DGX Spark"
requires-python = ">=3.12"
dependencies = ["fastapi>=0.115,<1", "uvicorn>=0.30,<1", "pydantic>=2.10,<3", "httpx[socks]>=0.27,<1", "python-multipart>=0.0.20", "psutil>=6", "huggingface-hub==2.3.0"]

[project.optional-dependencies]
train = ["jinja2>=3.1.6", "transformers==5.20.2", "trl==1.16.0", "peft==0.21.2", "accelerate==1.15.0", "datasets==5.1.0", "safetensors==0.8.0"]
bench = ["harbor==0.25.0"]
test = ["pytest>=8", "httpx>=0.27", "pyarrow>=21"]

[project.scripts]
spl-ft = "spl_ft.cli:main"

[tool.setuptools.packages.find]
include = ["spl_ft*"]

[tool.setuptools.package-data]
spl_ft = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
